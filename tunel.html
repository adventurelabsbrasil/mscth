<script>
// ================= cor da nota = cor da luz (mesma função do mscth) =================
function noteLightNm(pc){ let f=440*Math.pow(2,(pc-9)/12); while(f<400e12) f*=2; while(f>=800e12) f/=2; return 299792458/f*1e9; }
function nmToRgb(nm){ let r=0,g=0,b=0;
  if(nm<440){r=-(nm-440)/60;b=1;} else if(nm<490){g=(nm-440)/50;b=1;} else if(nm<510){g=1;b=-(nm-510)/20;}
  else if(nm<580){r=(nm-510)/70;g=1;} else if(nm<645){r=1;g=-(nm-645)/65;} else {r=1;}
  let k=1; if(nm<420) k=0.55+0.45*(nm-380)/40; else if(nm>650) k=0.5+0.5*(780-nm)/130;
  const c=x=>Math.round(255*Math.pow(Math.max(0,Math.min(1,x*k)),0.8)); return [c(r),c(g),c(b)]; }
const COL=[]; for(let pc=0;pc<12;pc++) COL.push(nmToRgb(Math.max(380,Math.min(780,noteLightNm(pc)))));
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const col=(m,a=1)=>rgba(COL[((m%12)+12)%12],a);
const mix=(c1,c2,t)=>[c1[0]+(c2[0]-c1[0])*t, c1[1]+(c2[1]-c1[1])*t, c1[2]+(c2[2]-c1[2])*t];
const scale=(c,k)=>[c[0]*k,c[1]*k,c[2]*k];

// ================= música =================
let LOOP=16, BASE=[], BASE_RAW=[], MAXD=4, LOW=36, HIGH=84, BPB=4, OFFSET=0;
(function demo(){
  const bar=(b,bass,triad,mel)=>{const o=b*4; BASE.push([bass,o,4,'baixo',0.8]); triad.forEach(m=>BASE.push([m,o,4,'acorde',0.7])); mel.forEach(([m,s,d])=>BASE.push([m,o+s,d,'melodia',0.9]));};
  bar(0,36,[48,52,55,59],[[76,0,1.5],[79,1.5,0.5],[76,2,2]]);   // C7M
  bar(1,45,[57,60,64],[[72,0,2],[71,2,1],[69,3,1]]);            // Am
  bar(2,41,[53,57,60],[[69,0,1],[72,1,1],[77,2,2]]);            // F
  bar(3,43,[55,59,62,65],[[74,0,2],[71,2,1],[67,3,1]]);         // G7
  BASE.sort((x,y)=>x[1]-y[1]); BASE_RAW=BASE.map(n=>n.slice());
})();
const DEMO=BASE_RAW.map(n=>n.slice());
// pedal virtual: cada nota soa até o fim do seu compasso
function applyPedal(){
  BASE=BASE_RAW.map(n=>{ const c=n.slice(); if(L.pedal){ const k=Math.floor((n[1]-OFFSET)/BPB+1e-6); const barEnd=OFFSET+(k+1)*BPB; c[2]=Math.max(n[2],barEnd-n[1]); } return c; });
  MAXD=Math.max(...BASE.map(n=>n[2]));
}
const DECAY={baixo:0.35,acorde:0.30,melodia:0.9};
const BASE_RAW_DUR=n=>n[2];

function notesIn(a,b){
  const out=[];
  for(let k=Math.max(0,Math.floor(a/LOOP)-1);k<=Math.floor(b/LOOP);k++){
    const lo=a-k*LOOP-MAXD, hi=b-k*LOOP;
    let i0=0,i1=BASE.length; while(i0<i1){ const md=(i0+i1)>>1; if(BASE[md][1]<lo) i0=md+1; else i1=md; }
    for(let i=i0;i<BASE.length && BASE[i][1]<=hi;i++){ const [m,s,d,r,v]=BASE[i]; const S=k*LOOP+s; if(S<=b && S+d>=a) out.push([m,S,d,r,v]); }
  }
  return out;
}
const soundingAt=t=>notesIn(t,t).filter(n=>n[1]<=t && n[1]+n[2]>t).map(n=>n[0]);

// ================= tom, cifra e grau =================
const SHARP=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const FLAT =['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
const DEG=['I','♭II','II','♭III','III','IV','♯IV','V','♭VI','VI','♭VII','VII'];
let KEY={tonic:0,mode:'maior'}, keyAuto=true;
const flatKey=()=> KEY.mode==='maior' ? [5,10,3,8,1,6].includes(KEY.tonic) : [2,7,0,5,10,3].includes(KEY.tonic);
// grafia: nota do tom segue a armadura; fora do tom, pelo grau (♭2 ♭3 ♭6 ♭7 em bemol; ♯4 e sensíveis em sustenido)
function nm(pc){ pc=((pc%12)+12)%12; const rel=(pc-KEY.tonic+12)%12;
  const dia=(KEY.mode==='maior'?[0,2,4,5,7,9,11]:[0,2,3,5,7,8,10]).includes(rel);
  if(dia) return (flatKey()?FLAT:SHARP)[pc];
  if(KEY.mode==='menor' && [4,9,11].includes(rel)) return SHARP[pc];
  return ([1,3,8,10].includes(rel)?FLAT:SHARP)[pc]; }
// [sufixo BR, intervalos, qualidade]
const TPL=[['7M',[0,4,7,11],'maj'],['7',[0,4,7,10],'dom'],['m7',[0,3,7,10],'min'],['m7(♭5)',[0,3,6,10],'dim'],['°7',[0,3,6,9],'dim'],
  ['m(7M)',[0,3,7,11],'min'],['',[0,4,7],'maj'],['m',[0,3,7],'min'],['°',[0,3,6],'dim'],['+',[0,4,8],'aug'],
  ['sus4',[0,5,7],'sus'],['sus2',[0,2,7],'sus'],['5',[0,7],'pow']];
function chordInfo(ms){
  if(!ms.length) return null;
  const pcs=new Set(ms.map(m=>m%12)); if(pcs.size<2) return null;
  const bass=Math.min(...ms)%12; let best=null;
  for(const [suf,iv,q] of TPL) for(let r=0;r<12;r++){
    if(!iv.every(x=>pcs.has((r+x)%12))) continue;
    const sc=iv.length*10-(pcs.size-iv.length)*4+(r===bass?3:0)-(q==='sus'||q==='pow'?2:0);
    if(!best||sc>best.sc) best={sc,root:r,suf,iv,q};
  }
  if(!best) return null;
  const extra=[...pcs].map(p=>(p-best.root+12)%12).filter(x=>!best.iv.includes(x)).sort((a,b)=>a-b);
  const tones=best.iv.concat(extra).map(x=>(best.root+x)%12);
  return {root:best.root,suf:best.suf,q:best.q,bass,tones,pcs:[...pcs]};
}
const chordName=ci=>ci ? nm(ci.root)+ci.suf+(ci.bass!==ci.root?'/'+nm(ci.bass):'') : '';
const chordNotes=ci=>ci ? ci.tones.map(nm).join(' ') : '';
const chordDegree=ci=>ci ? DEG[(ci.root-KEY.tonic+12)%12]+ci.suf : '';

// tom pelo perfil de Krumhansl-Kessler (peso = duração)
function detectKey(){
  const MA=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88], MI=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
  const h=new Array(12).fill(0); BASE.forEach(n=>h[n[0]%12]+=n[2]);
  const corr=(p,x)=>{ const mp=p.reduce((a,b)=>a+b)/12, mx=x.reduce((a,b)=>a+b)/12; let n=0,dp=0,dx=0; for(let i=0;i<12;i++){ n+=(p[i]-mp)*(x[i]-mx); dp+=(p[i]-mp)**2; dx+=(x[i]-mx)**2; } return n/Math.sqrt(dp*dx||1); };
  let best={r:-2};
  for(let t=0;t<12;t++){ const rot=h.slice(t).concat(h.slice(0,t));
    const a=corr(MA,rot), b=corr(MI,rot); if(a>best.r) best={r:a,tonic:t,mode:'maior'}; if(b>best.r) best={r:b,tonic:t,mode:'menor'}; }
  return {tonic:best.tonic,mode:best.mode};
}

// linha do tempo dos acordes (pré-calculada; troca só quando o acorde muda e dura ≥ ½ tempo)
// acorde por janela harmônica: todas as notas tocadas na janela (arpejo conta), peso = duração, grave pesa mais
let TL=[];
const SCALE_MA=[0,2,4,5,7,9,11], SCALE_MI=[0,2,3,5,7,8,10,11];
let SCALE=SCALE_MA;
function chordWindow(t,win){
  SCALE=KEY.mode==='maior'?SCALE_MA:SCALE_MI;
  // casamento de modelo (Pardo & Birmingham): cada nota da janela vale ~1 evento (acompanhamento 1,5; nota curtíssima 0,5)
  const w=new Array(12).fill(0), low={}; let bassM=999, accomp=0;
  notesIn(t,t+win).forEach(([m,s,d,role])=>{ const ov=Math.min(s+d,t+win)-Math.max(s,t); if(ov<=0.02) return;
    const c=(role==='melodia'?1:1.5)*(ov>=0.2?1:0.5); w[m%12]+=c; if(role!=='melodia') accomp++;
    if(low[m%12]==null||m<low[m%12]) low[m%12]=m; if(m<bassM) bassM=m; });
  if(!accomp) return null;                       // só melodia (ex.: anacruse): sem acorde
  const tot=w.reduce((a,b)=>a+b), bass=bassM%12; let best=null;
  for(const [suf,iv,q] of TPL) for(let r=0;r<12;r++){
    let P=0,M=0; iv.forEach(x=>{ const v=w[(r+x)%12]; if(v>0) P+=v; else M++; });
    if(!w[r]) continue;                          // a fundamental tem que soar
    if(iv.length-M<Math.max(2,iv.length-1)) continue;   // no máximo 1 nota do modelo faltando; tétrade exige 3 presentes
    const dia=iv.every(x=>SCALE.includes((r+x-KEY.tonic+12)%12));   // desempate pelo tom
    const sc=P-(tot-P)-M*1.2-(iv.length>3?2.2:0)-(q==='pow'?1.5:0)-(q==='sus'?1:0)+(r===bass?0.6:0)+(dia?0.8:0);
    if(!best||sc>best.sc) best={sc,root:r,suf,iv,q};
  }
  if(!best) return null;
  const tones=best.iv.map(x=>(best.root+x)%12).filter(pc=>w[pc]>0);
  const ms=tones.map(pc=>low[pc]); if(!ms.includes(bassM)) ms.push(bassM);
  return {ci:{root:best.root,suf:best.suf,q:best.q,bass,tones,pcs:tones}, ms};
}
function buildTimeline(){
  const win=BPB>=3?BPB/2:BPB; TL=[];
  for(let t=OFFSET-win*Math.ceil(OFFSET/win);t<LOOP;t+=win){
    const r=chordWindow(Math.max(0,t),win+Math.min(0,t)); const name=r?chordName(r.ci):'';
    const last=TL[TL.length-1];
    if(!name){ continue; }
    if(last && last.name===name && Math.abs(last.t1-Math.max(0,t))<1e-6){ last.t1=t+win; continue; }
    TL.push({t0:Math.max(0,t),t1:t+win,name,ci:r.ci,ms:r.ms});
  }
}
function chordAt(t){ const x=((t%LOOP)+LOOP)%LOOP; for(let i=TL.length-1;i>=0;i--) if(TL[i].t0<=x+1e-6) return TL[i].t1>x ? TL[i] : null; return null; }

// cor do acorde
function chordColor(ci){
  if(!ci || L.corAcorde==='branco') return [255,255,255];
  if(L.corAcorde==='mistura'){ // média de luz (raiz da média dos quadrados)
    const s=[0,0,0]; ci.pcs.forEach(p=>{ for(let i=0;i<3;i++) s[i]+=COL[p][i]**2; });
    const c=s.map(v=>Math.sqrt(v/ci.pcs.length)); const mx=Math.max(...c)||1; return scale(c,255/mx);
  }
  const base=COL[ci.root];
  if(ci.q==='min') return scale(mix(base,COL[(ci.root+3)%12],0.4),0.85);   // menor: puxa pra cor da 3ª menor, mais escuro
  if(ci.q==='dim') return scale(mix(base,[128,128,128],0.45),0.7);
  if(ci.q==='aug') return mix(base,[255,255,255],0.35);
  if(ci.q==='sus'||ci.q==='pow') return mix(base,[200,200,200],0.3);
  return base;                                                              // maior e dominante: a cor da fundamental
}
const chordDash=ci=>!ci||L.corAcorde==='branco' ? [] : ci.q==='min' ? [7,5] : ci.q==='dim' ? [2,4] : [];

// ================= camadas (o que mostrar) =================
const LAYERS=[
  ['fios',[['baixo','baixo'],['acorde','notas do acorde'],['melodia','melodia'],['contorno','contorno da melodia'],['pedal','pedal (sustenta até o fim do compasso)']]],
  ['acordes',[['poligono','forma do acorde agora'],['fatias','anel na troca de acorde'],['nomes','cifra no eixo'],['comp','composição (C E G)'],['grau','grau no tom (I7M)']]],
  ['quadros 2D',[['quadro','teia (quadro que se acumula)'],['teiaAcorde','teia: acordes (raios)'],['teiaMel','teia: melodia (espiral)'],['teiaBaixo','teia: baixo (fio-guia)'],['roll','piano roll']]],
  ['cena',[['clarao','clarão branco no ataque'],['cabeca','cabeça (anéis e notas)'],['eixo','eixo do tempo'],['brilho','brilho'],['hud','acorde no canto']]],
];
const DEF={teiaAcorde:true,teiaMel:true,teiaBaixo:true,quadro:true,roll:true,clarao:true,contorno:true,pedal:false,baixo:true,acorde:true,melodia:true,poligono:true,fatias:true,nomes:true,comp:true,grau:true,cabeca:true,eixo:true,brilho:true,hud:true,corAcorde:'fundamental'};
let L=Object.assign({},DEF);
try{ const saved=JSON.parse(localStorage.getItem('tunel-camadas')||'null'); if(saved) L=Object.assign(L,saved); }catch(e){}
const saveL=()=>{ try{ localStorage.setItem('tunel-camadas',JSON.stringify(L)); }catch(e){} };
function buildPanel(){
  const p=document.getElementById('panel'); let h='';
  LAYERS.forEach(([title,items])=>{ h+=`<h2>${title}</h2>`; items.forEach(([k,lab])=>{ h+=`<label><input type="checkbox" data-k="${k}" ${L[k]?'checked':''}> ${lab}</label>`; }); });
  h+=`<h2>cor do acorde</h2><select id="corAcorde">
      <option value="fundamental">fundamental (menor puxa pra 3ª)</option><option value="mistura">mistura das notas</option><option value="branco">branco</option></select>`;
  h+=`<h2>tom</h2><select id="keySel"><option value="auto">automático</option>`;
  for(const md of ['maior','menor']) for(let t=0;t<12;t++) h+=`<option value="${t}:${md}">${SHARP[t]} ${md}</option>`;
  h+=`</select><h2>predefinições</h2><div class="presets"><button id="pClean">limpo</button><button id="pFull">completo</button></div>`;
  p.innerHTML=h;
  p.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{ L[c.dataset.k]=c.checked; saveL(); if(c.dataset.k==='pedal'){ applyPedal(); } });
  const ca=document.getElementById('corAcorde'); ca.value=L.corAcorde; ca.onchange=()=>{ L.corAcorde=ca.value; saveL(); };
  const ks=document.getElementById('keySel'); ks.value=keyAuto?'auto':KEY.tonic+':'+KEY.mode;
  ks.onchange=()=>{ if(ks.value==='auto'){ keyAuto=true; KEY=detectKey(); } else { keyAuto=false; const [t,md]=ks.value.split(':'); KEY={tonic:+t,mode:md}; } };
  document.getElementById('pClean').onclick=()=>{ Object.assign(L,{fatias:false,nomes:true,comp:false,grau:false,cabeca:false,eixo:false,brilho:false,hud:true,poligono:true}); saveL(); buildPanel(); };
  document.getElementById('pFull').onclick=()=>{ L=Object.assign({},DEF,{corAcorde:L.corAcorde,pedal:L.pedal}); saveL(); buildPanel(); };
}

// ================= estado e controles =================
const st={view:'lado',now:0,playing:false,omega:0.5,mem:16,bpm:84,follow:true,yaw:-0.42,pitch:0.32,sound:true};
const $=id=>document.getElementById(id);
const hashT=parseFloat((location.hash.match(/t=([\d.]+)/)||[])[1]); if(!isNaN(hashT)) st.now=hashT;
const bind=(id,key,fmt)=>{ const el=$(id), out=$(id+'V'); const f=()=>{ st[key]=+el.value; out.textContent=fmt(st[key]); }; el.oninput=f; f(); };
bind('giro','omega',v=>v===0?'parado':(v===1?'1 volta/comp.':v+' volta/comp.'));
bind('mem','mem',v=>v+' tempos');
bind('bpm','bpm',v=>v+' bpm');
$('cam').onclick=()=>{ st.follow=!st.follow; $('cam').textContent=st.follow?'câmera segue':'câmera fixa'; $('cam').classList.toggle('on',st.follow); };
const VIEWS={lado:{yaw:-0.42,pitch:0.32,label:'vista: lado'},frente:{yaw:1.5707,pitch:0.12,label:'vista: frente'},viagem:{yaw:-1.5707,pitch:0.0001,label:'vista: viagem ✈'}};
function setView(v){ st.view=v; st.yaw=VIEWS[v].yaw; st.pitch=VIEWS[v].pitch; $('front').textContent=VIEWS[v].label; $('front').classList.toggle('on',v!=='lado'); }
$('front').onclick=()=>{ const order=['lado','frente','viagem']; setView(order[(order.indexOf(st.view)+1)%3]); };
{ const hv=(location.hash.match(/view=(\w+)/)||[])[1]; if(hv&&VIEWS[hv]) setView(hv); }
$('snd').onclick=()=>{ st.sound=!st.sound; $('snd').textContent=st.sound?'som ligado':'som desligado'; $('snd').classList.toggle('on',st.sound); };

let ac=null, master=null, schedUntil=0, polyGain=1;
function initAudio(){ if(ac) return; ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=0.22; master.connect(ac.destination); }
function voice(m,when,dur,role,vel){
  const f=440*Math.pow(2,(m-69)/12), o=ac.createOscillator(), g=ac.createGain();
  o.type=role==='melodia'?'triangle':'sine'; o.frequency.value=f;
  const peak=(role==='melodia'?0.5:(role==='baixo'?0.55:0.22))*(0.3+0.9*(vel==null?0.8:vel))*polyGain;
  const end=when+dur*60/st.bpm;
  g.gain.setValueAtTime(0,when); g.gain.linearRampToValueAtTime(peak,when+0.01);
  g.gain.setTargetAtTime(peak*0.25,when+0.01,DECAY[role]>0.5?0.25:0.9);
  g.gain.setTargetAtTime(0,end,0.08);
  o.connect(g); g.connect(master); o.start(when); o.stop(end+0.6);
}
function scheduleAudio(){
  if(!ac||!st.playing||!st.sound){ schedUntil=st.now; return; }
  const ahead=st.now+0.6; if(schedUntil<st.now) schedUntil=st.now;
  notesIn(schedUntil,ahead).forEach(([m,s,d,r,v])=>{ if(s>=schedUntil && s<ahead) voice(m,Math.max(ac.currentTime,ac.currentTime+(s-st.now)*60/st.bpm),d,r,v); });
  schedUntil=ahead;
}
function setPlaying(on){ st.playing=on; $('play').textContent=on?'❚❚ pausar':'▶ tocar'; $('play').classList.toggle('on',on); schedUntil=st.now; }

function afterLoad(){ if(window.artReady) artClear(); applyPedal(); KEY=keyAuto?detectKey():KEY; buildTimeline(); buildPanel(); }
function loadMidi(file){
  return file.arrayBuffer().then(buf=>{
    const r=parseMidi(buf);
    if(!r.notes.length) throw new Error('nenhuma nota encontrada (só bateria?)');
    // papel: com 2+ trilhas, a mais aguda é a melodia e a mais grave é o baixo; senão, pela altura
    const tr={}; r.notes.forEach(n=>{ (tr[n.tr]=tr[n.tr]||[]).push(n.m); });
    const means=Object.keys(tr).map(k=>[+k,tr[k].reduce((a,b)=>a+b)/tr[k].length]).sort((a,b)=>a[1]-b[1]);
    const roleOf=n=>{ if(means.length>=2){ if(n.tr===means[means.length-1][0]) return 'melodia'; if(n.tr===means[0][0]) return 'baixo'; return 'acorde'; }
      return n.m<48?'baixo':(n.m>=72?'melodia':'acorde'); };
    BASE_RAW=r.notes.map(n=>[n.m,n.s,n.d,roleOf(n),n.v]); BASE=BASE_RAW.map(n=>n.slice());
    BPB=r.beatsPerBar; LOOP=Math.max(BPB,r.length);
    // anacruse: o compasso começa onde entra a primeira nota do baixo
    const fb=BASE_RAW.find(n=>n[3]==='baixo'); OFFSET=fb?((fb[1]%BPB)+BPB)%BPB:0;
    MAXD=Math.max(...BASE.map(n=>n[2]));
    const ms=BASE.map(n=>n[0]); LOW=Math.min(36,Math.min(...ms)); HIGH=Math.max(84,Math.max(...ms));
    let peak=0; for(let t=0;t<LOOP;t+=0.5) peak=Math.max(peak,soundingAt(t).length); polyGain=Math.min(1,4/Math.max(1,peak));
    $('bpm').value=r.bpm; $('bpm').oninput();
    st.now=0; schedUntil=0; afterLoad();
    $('fname').textContent=file.name+' · '+BASE.length+' notas · '+r.bpm+' bpm';
  }).catch(e=>{ $('fname').textContent='erro: '+e.message; throw e; });
}

// quadro dos acordes: cada acorde que soa vira um polígono (ângulo = nota, raio = oitava) numa tela que não apaga
const artc=document.getElementById('artc'), actx=artc.getContext('2d'); let artStep=-1, artPrevNow=0;
function artSize(){ const z=Math.round(Math.min(240,innerWidth*0.2,innerHeight*0.3)); artc.style.width=artc.style.height=z+'px'; if(artc.width!==z*2){ artc.width=artc.height=z*2; artClear(); } }
function artClear(){ actx.globalCompositeOperation='source-over'; actx.fillStyle='#050506'; actx.fillRect(0,0,artc.width,artc.height); artStep=-1; }
window.artClear=artClear;
document.getElementById('artClr').onclick=artClear;
document.getElementById('artSave').onclick=()=>{ const a=document.createElement('a'); a.download='teia-da-musica.png'; a.href=artc.toDataURL('image/png'); a.click(); };
let artMel=null, artBass=null;
function drawArt(NOW, live, cc){
  document.getElementById('art').style.display=L.quadro?'':'none'; if(!L.quadro){ artPrevNow=NOW; return; }
  if(NOW<artPrevNow-1e-6 || Math.floor(NOW/LOOP)!==Math.floor(artPrevNow/LOOP)){ artClear(); artMel=artBass=null; artPrevNow=NOW; }
  const S=artc.width, c=S/2, rO=S*0.46, rI=S*0.1;
  const P=m=>{ const r=rO-(m-LOW)/(HIGH-LOW)*(rO-rI), a=-Math.PI/2+(m%12)/12*2*Math.PI; return [c+r*Math.cos(a), c+r*Math.sin(a)]; };
  actx.globalCompositeOperation='lighter';
  // fio de seda: curva levemente puxada pro centro, em gradiente entre as cores das duas notas
  const silk=(a,b,alpha,width)=>{ const p=P(a), q=P(b); if(a===b) return;
    const mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2, cx=mx+(c-mx)*0.18, cy=my+(c-my)*0.18;
    const g=actx.createLinearGradient(p[0],p[1],q[0],q[1]); g.addColorStop(0,col(a,alpha)); g.addColorStop(1,col(b,alpha));
    actx.strokeStyle=g; actx.lineWidth=width; actx.beginPath(); actx.moveTo(p[0],p[1]); actx.quadraticCurveTo(cx,cy,q[0],q[1]); actx.stroke(); };
  const knot=(m,alpha,r)=>{ const p=P(m); actx.fillStyle=col(m,alpha); actx.beginPath(); actx.arc(p[0],p[1],r,0,7); actx.fill(); };
  // ataques desde o último quadro: melodia tece a espiral, baixo tece o fio-guia
  if(NOW>artPrevNow){
    const atk=notesIn(artPrevNow,NOW).filter(n=>n[1]>artPrevNow && n[1]<=NOW).sort((x,y)=>x[1]-y[1]||y[0]-x[0]);
    let lastS=null;
    atk.forEach(([m,s,d,role])=>{
      if(role==='melodia'){ if(lastS===s) return; lastS=s;   // só a voz de cima
        if(L.teiaMel && artMel!=null) silk(artMel,m,0.32,S/520);
        if(L.teiaMel) knot(m,0.10,S/220); artMel=m; }
      else if(role==='baixo'){ if(L.teiaBaixo && artBass!=null) silk(artBass,m,0.22,S/260); if(L.teiaBaixo) knot(m,0.12,S/160); artBass=m; }
    });
  }
  artPrevNow=NOW;
  // raios: o acorde que soa, bem translúcido (8 camadas por tempo, independe do fps)
  const step=Math.floor(NOW*8); if(!L.teiaAcorde || step===artStep || live.length<2) return; artStep=step;
  const pts=live.map(n=>P(n[0]));
  actx.beginPath(); pts.forEach((q,i)=>i?actx.lineTo(q[0],q[1]):actx.moveTo(q[0],q[1])); actx.closePath();
  actx.fillStyle=rgba(cc,0.010); actx.fill();
  actx.strokeStyle=rgba(cc,0.045); actx.lineWidth=S/400; actx.stroke();
}
// piano roll de jogo: notas caem até o teclado; a tecla acende na cor da nota, com clarão no ataque
const rollc=document.getElementById('rollc'), rctx=rollc.getContext('2d');
const BLACK=[1,3,6,8,10];
function drawRoll(NOW){
  document.getElementById('roll').style.display=L.roll?'':'none'; if(!L.roll) return;
  const w=Math.round(Math.min(330,innerWidth*0.24)), h=Math.round(Math.min(150,innerHeight*0.2)), dpr=1.5;
  if(rollc.width!==w*dpr||rollc.height!==h*dpr){ rollc.width=w*dpr; rollc.height=h*dpr; rollc.style.width=w+'px'; rollc.style.height=h+'px'; }
  const X=rctx; X.setTransform(dpr,0,0,dpr,0,0);
  X.globalCompositeOperation='source-over'; X.fillStyle='#050506'; X.fillRect(0,0,w,h);
  const lo=Math.max(21,LOW-1), hi=Math.min(108,HIGH+1), n=hi-lo+1, kw=w/n, KH=Math.min(34,h*0.18), top=h-KH;
  const AHEAD=6, PX=top/AHEAD;   // 6 tempos de futuro caindo
  // linhas de compasso
  X.strokeStyle='rgba(255,255,255,0.06)'; X.lineWidth=1;
  for(let b=Math.ceil((NOW-OFFSET)/BPB)*BPB+OFFSET; b<NOW+AHEAD; b+=BPB){ const y=top-(b-NOW)*PX; X.beginPath(); X.moveTo(0,y); X.lineTo(w,y); X.stroke(); }
  const FL=0.25*st.bpm/60, lit={};
  notesIn(NOW-0.01,NOW+AHEAD).forEach(([m,s,d,role,v])=>{ if(!L[role]||m<lo||m>hi) return;
    const x=(m-lo)*kw, y1=top-(s-NOW)*PX, y0=top-(s+d-NOW)*PX, on=s<=NOW&&s+d>NOW;
    X.fillStyle=col(m,on?1:0.75); X.fillRect(x+0.5,Math.max(0,y0),Math.max(1,kw-1),Math.min(top,y1)-Math.max(0,y0));
    if(on){ lit[m]={age:NOW-s,v}; }
  });
  // teclado
  for(let m=lo;m<=hi;m++){ const x=(m-lo)*kw, bk=BLACK.includes(m%12), L2=lit[m];
    X.fillStyle=L2?col(m):(bk?'#1b1b1f':'#d8d8d2'); X.fillRect(x+0.5,top+1,Math.max(1,kw-1),bk?KH*0.62:KH-1);
    if(!bk && !L2){ X.fillStyle='#bdbdb6'; X.fillRect(x+0.5,top+KH*0.62,Math.max(1,kw-1),KH*0.38-1); }
  }
  // clarão no ataque
  X.globalCompositeOperation='lighter';
  Object.keys(lit).forEach(k=>{ const m=+k, a=lit[k].age; if(!L.clarao||a>FL) return; const al=Math.pow(1-a/FL,1.6);
    const cx=(m-lo+0.5)*kw, g=X.createRadialGradient(cx,top,0,cx,top,kw*4+10);
    g.addColorStop(0,`rgba(255,255,255,${0.9*al})`); g.addColorStop(1,'rgba(255,255,255,0)');
    X.fillStyle=g; X.fillRect(cx-kw*4-10,top-kw*4-10,kw*8+20,kw*8+20); });
  X.globalCompositeOperation='source-over';
  X.fillStyle='rgba(255,255,255,0.5)'; X.fillRect(0,top,w,1);
}

let drag=null;
const cv=$('cv'), ctx=cv.getContext('2d');
cv.onpointerdown=e=>{ drag=[e.clientX,e.clientY,st.yaw,st.pitch]; cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing'; };
cv.onpointermove=e=>{ if(!drag) return; st.yaw=drag[2]+(e.clientX-drag[0])*0.006; st.pitch=Math.max(-1.2,Math.min(1.2,drag[3]+(e.clientY-drag[1])*0.006)); };
cv.onpointerup=()=>{ drag=null; cv.style.cursor='grab'; };
let W,H,DPR;
function resize(){ DPR=Math.min(1.5,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }

// ================= desenho =================
let hudLast='';
function frame(ts){
  if(frame.last==null) frame.last=ts;
  const dt=Math.min(0.1,(ts-frame.last)/1000); frame.last=ts;
  if(st.playing) st.now+=dt*st.bpm/60;
  scheduleAudio();
  const NOW=st.now, from=NOW-st.mem;
  const SC=Math.min(W/1500,H/900), SX=46, RMAX=190, RMIN=42;
  const CX=(st.follow&&st.view==='lado')?W*0.68:W*0.5, CY=H*0.52;
  const FC=st.view==='viagem'?330:1800;   // distância da câmera: na viagem ela fica dentro do túnel, logo atrás da cabeça
  const headX=st.follow?0:(((NOW%LOOP)/LOOP)-0.5)*Math.min(LOOP,32)*SX*0.9;
  const cy=Math.cos(st.yaw), sy=Math.sin(st.yaw), cp=Math.cos(st.pitch), sp=Math.sin(st.pitch);
  const rOf=m=>RMAX-(m-LOW)/(HIGH-LOW)*(RMAX-RMIN);
  const cone=m=>(m-LOW)/(HIGH-LOW)*40;
  const om=st.omega*2*Math.PI/BPB;
  const ang=(m,t)=>-Math.PI/2+(m%12)/12*2*Math.PI+om*t;
  const P=(x,y,z)=>{ const x1=x*cy-z*sy, z1=x*sy+z*cy; const y2=y*cp-z1*sp, z2=y*sp+z1*cp; const den=FC-z2; if(den<28) return [NaN,NaN,z2]; const k=FC/den; return [CX+x1*k*SC, CY-y2*k*SC, z2]; };
  const pt=(m,t)=>{ const r=rOf(m), a=ang(m,t); return P((t-NOW)*SX+headX+cone(m), -r*Math.sin(a), r*Math.cos(a)); };
  const headPt=(r,a,x)=>P(headX+x, -r*Math.sin(a), r*Math.cos(a));
  const fadeAt=t=>Math.max(0,1-(NOW-t)/st.mem);
  const near=q=>st.view==='viagem' && (FC-q[2])<120;   // perto demais da câmera na viagem: não desenha anel/contorno

  ctx.globalCompositeOperation='source-over'; ctx.setLineDash([]);
  ctx.fillStyle='#0b0b0d'; ctx.fillRect(0,0,W,H);

  if(L.eixo){ const a=P((from-NOW)*SX+headX,0,0), b=P(3*SX+headX,0,0);
    ctx.strokeStyle='rgba(255,255,255,0.16)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); }

  // trocas de acorde dentro da janela
  const changes=[];
  for(let k=Math.max(0,Math.floor(from/LOOP));k<=Math.floor(NOW/LOOP);k++) TL.forEach(s=>{ const T=k*LOOP+s.t0; if(T>=from && T<=NOW) changes.push({T,s}); });

  if(L.nomes||L.comp||L.grau){
    ctx.textAlign='left';
    let lastX=-1e9; changes.sort((a,b)=>a.T-b.T);
    changes.forEach(({T,s})=>{ const f=fadeAt(T), q=P((T-NOW)*SX+headX,RMAX+46,0); let y=q[1];
      if(Math.abs(q[0]-lastX)<90*SC/0.62) return; lastX=q[0];
      const c=chordColor(s.ci);
      if(L.nomes){ ctx.font=`${Math.round(17*SC/0.62)}px Menlo`; ctx.fillStyle=rgba(L.corAcorde==='branco'?[240,240,235]:mix(c,[255,255,255],0.35),0.9*f); ctx.fillText(chordName(s.ci),q[0],y); y+=15*SC/0.62; }
      ctx.font=`${Math.round(11*SC/0.62)}px Menlo`;
      if(L.comp){ ctx.fillStyle=`rgba(200,200,192,${0.75*f})`; ctx.fillText(chordNotes(s.ci),q[0],y); y+=13*SC/0.62; }
      if(L.grau){ ctx.fillStyle=`rgba(232,69,30,${0.95*f})`; ctx.fillText(chordDegree(s.ci),q[0],y); }
    });
  }

  ctx.globalCompositeOperation='lighter';
  // anel na troca de acorde, na cor do acorde
  if(L.fatias) changes.forEach(({T,s})=>{
    const ms=s.ms.slice().sort((x,y)=>(x%12)-(y%12)); if(ms.length<2) return;
    const f=fadeAt(T), c=chordColor(s.ci);
    const sq=ms.map(m=>pt(m,T)); if(sq.some(near)) return;
    ctx.beginPath(); sq.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
    ctx.setLineDash(chordDash(s.ci)); ctx.strokeStyle=rgba(c,0.55*f); ctx.lineWidth=1.2; ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=rgba(c,0.06*f); ctx.fill();
  });

  // contorno: liga o fim de cada nota da melodia ao começo da próxima
  if(L.contorno && L.melodia){
    const mel=notesIn(from,NOW).filter(n=>n[3]==='melodia' && n[1]<=NOW).sort((a,b)=>a[1]-b[1]||b[0]-a[0]);
    const top=[]; mel.forEach(n=>{ const l=top[top.length-1]; if(l && Math.abs(l[1]-n[1])<1e-6) return; top.push(n); });
    ctx.lineWidth=1.2*SC/0.7;
    for(let i=1;i<top.length;i++){ const a=top[i-1], b=top[i]; const ta=Math.min(a[1]+BASE_RAW_DUR(a),b[1]);
      const p1=pt(a[0],Math.max(from,ta)), p2=pt(b[0],b[1]); const f=fadeAt(b[1]); if(!isFinite(p1[0]+p2[0])||near(p1)||near(p2)) continue;
      const g=ctx.createLinearGradient(p1[0],p1[1],p2[0],p2[1]); g.addColorStop(0,col(a[0],0.5*f)); g.addColorStop(1,col(b[0],0.5*f));
      ctx.strokeStyle=g; ctx.beginPath(); ctx.moveTo(p1[0],p1[1]); ctx.lineTo(p2[0],p2[1]); ctx.stroke(); }
  }
  // fios: poucos traços por nota (sem shadowBlur)
  const notes=notesIn(from,NOW).filter(n=>n[1]<=NOW && L[n[3]]);
  const wires=[];
  notes.forEach(([m,s,d,role,v])=>{
    const a0=Math.max(s,from), end=Math.min(s+d,NOW); if(end<=a0) return;
    const n=Math.max(2,Math.min(48,Math.round((end-a0)*7))), pts=[], ts=[];
    for(let i=0;i<=n;i++){ const t=a0+(end-a0)*i/n; pts.push(pt(m,t)); ts.push(t); }
    wires.push({m,s,role,v:v==null?0.8:v,pts,ts,live:s+d>NOW,depth:pts[n>>1][2]});
  });
  wires.sort((a,b)=>a.depth-b.depth);
  const baseW={melodia:4.2,baixo:4.6,acorde:3.2};
  ctx.lineCap='butt'; ctx.lineJoin='round';
  wires.forEach(w=>{
    const CH=4;
    for(let c=0;c<w.pts.length-1;c+=CH){
      const e=Math.min(c+CH,w.pts.length-1), tm=(w.ts[c]+w.ts[e])/2;
      const env=(0.25+0.75*Math.exp(-DECAY[w.role]*(tm-w.s)))*(0.5+0.6*w.v), f=fadeAt(tm);
      const al=Math.min(1,(0.2+0.8*env)*Math.pow(f,1.3)*(w.live?1.15:0.9));
      if(al<0.02) continue;
      const zk=st.view==='viagem'?Math.min(5,Math.max(0.6,FC/Math.max(28,FC-w.pts[c][2]))):1;   // perto da câmera, fio mais grosso
      const lw=baseW[w.role]*(0.3+0.7*env)*SC/0.7*zk;
      ctx.beginPath(); ctx.moveTo(w.pts[c][0],w.pts[c][1]); for(let i=c+1;i<=e;i++) ctx.lineTo(w.pts[i][0],w.pts[i][1]);
      if(L.brilho && NOW-tm<1.5){ ctx.strokeStyle=col(w.m,al*0.16); ctx.lineWidth=lw*3.2; ctx.stroke(); }
      ctx.strokeStyle=col(w.m,al); ctx.lineWidth=lw; ctx.stroke();
    }
  });

  // cabeça
  ctx.globalCompositeOperation='source-over';
  if(L.cabeca){
    for(let m=Math.ceil(LOW/12)*12;m<=HIGH;m+=12){ ctx.beginPath(); const r=rOf(m);
      for(let i=0;i<=72;i++){ const q=headPt(r,i/72*2*Math.PI,cone(m)); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); }
      ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=1; ctx.stroke(); }
    for(let pc=0;pc<12;pc++){ const q=headPt(RMAX+12,ang(pc,NOW),0); ctx.fillStyle=col(pc,0.8); ctx.beginPath(); ctx.arc(q[0],q[1],3.2*SC/0.7,0,7); ctx.fill(); }
  }

  // agora: forma do acorde + pontos vivos
  ctx.globalCompositeOperation='lighter';
  const live=notes.filter(n=>n[1]+n[2]>NOW).sort((x,y)=>(x[0]%12)-(y[0]%12));
  const cur=chordAt(NOW), curC=chordColor(cur&&cur.ci);
  if(L.poligono && live.length>1){
    const lp=live.map(n=>pt(n[0],NOW));
    ctx.beginPath(); lp.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.closePath();
    ctx.fillStyle=rgba(curC,L.corAcorde==='branco'?0.08:0.2); ctx.fill();
    ctx.setLineDash(chordDash(cur&&cur.ci)); ctx.strokeStyle=rgba(curC,0.95); ctx.lineWidth=1.8; ctx.stroke(); ctx.setLineDash([]);
  }
  live.forEach(n=>{ const env=0.25+0.75*Math.exp(-DECAY[n[3]]*(NOW-n[1])), q=pt(n[0],NOW), r=(3+5*env)*SC/0.7;
    if(L.brilho){ ctx.fillStyle=col(n[0],0.18); ctx.beginPath(); ctx.arc(q[0],q[1],r*2.6,0,7); ctx.fill(); }
    ctx.fillStyle=col(n[0]); ctx.beginPath(); ctx.arc(q[0],q[1],r,0,7); ctx.fill(); });
  // clarão: no ataque, um flash branco onde a nota está sendo tocada (~0,25 s, sem memória)
  if(L.clarao){
    const FL=0.25*st.bpm/60;   // 0,25 s em tempos
    notesIn(NOW-FL,NOW).forEach(([m,s,d,role,v])=>{ const age=NOW-s; if(age<0||age>FL||!L[role]) return;
      const q=pt(m,NOW); if(!isFinite(q[0])) return;
      const a=Math.pow(1-age/FL,1.6), R=(18+26*(v==null?0.8:v))*SC/0.7*(role==='melodia'?1.1:1);
      const g=ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],R);
      g.addColorStop(0,`rgba(255,255,255,${0.95*a})`); g.addColorStop(0.25,`rgba(255,255,255,${0.45*a})`); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(q[0],q[1],R,0,7); ctx.fill(); });
  }
  ctx.globalCompositeOperation='source-over';

  // canto: cifra, composição, grau e tom
  const ci=cur&&cur.ci, key=(L.hud?1:0)+'|'+chordName(ci)+'|'+L.comp+L.grau+L.corAcorde+KEY.tonic+KEY.mode;
  if(key!==hudLast){ hudLast=key;
    $('hud').style.display=L.hud?'':'none';
    $('hN').textContent=chordName(ci); $('hN').style.color=L.corAcorde==='branco'?'#f1f1ea':rgba(mix(curC,[255,255,255],0.3),1);
    $('hC').textContent=L.comp?chordNotes(ci):''; $('hG').textContent=L.grau?chordDegree(ci):'';
    $('hK').textContent='tom: '+nm(KEY.tonic)+' '+KEY.mode+(keyAuto?' (automático)':'');
  }
  drawArt(NOW, live, curC); drawRoll(NOW);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
